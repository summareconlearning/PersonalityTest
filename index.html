<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link href="https://fonts.googleapis.com/css2?family=Handjet:wght@700..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="preload" href="https://cdn.jsdelivr.net/fontsource/fonts/geist-pixel:vf@5.3.1/latin-elsh-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Geist Pixel (single weight 400, variable axis ELSH) - dimuat langsung dari CDN Fontsource/jsDelivr */
@font-face{font-family:'Geist Pixel';font-style:normal;font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/fontsource/fonts/geist-pixel:vf@5.3.1/latin-elsh-normal.woff2) format('woff2-variations'),url(https://cdn.jsdelivr.net/fontsource/fonts/geist-pixel:vf@5.3.1/latin-elsh-normal.woff2) format('woff2')}
@property --a{syntax:'<color>';inherits:true;initial-value:#EDE7DC}
@property --b{syntax:'<color>';inherits:true;initial-value:#EDE7DC}

:root{--px:'Handjet','Courier New',monospace;--gf:'Geist Pixel','Courier New',monospace;--bf:var(--gf);--o:#F28A30;--od:#C4631A;--g:#0F6B35;--ink:#1D1B22;--cream:#FFF1E3;--bd:#A9ADD6}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:400 15px var(--gf);font-synthesis:style;color:var(--ink);background:linear-gradient(160deg,var(--a),var(--b) 55%,var(--c));transition:--a 1.6s,--b 1.6s,--c 1.6s;display:grid;place-items:center;overflow:hidden}
.sun{position:fixed;width:min(24vw,260px);aspect-ratio:1;border-radius:50%;background:#FFF4B8;box-shadow:0 0 80px 36px #fff3b0aa;transform:translate(-50%,-50%);transition:left 1.8s,top 1.8s,opacity 1s;opacity:0}
.card{position:relative;z-index:2;width:86vw;height:85vh;background:#F8EEE9;border-radius:28px;border-bottom:6px solid var(--o);--pad:clamp(14px,2.6vw,34px);--hw:45%;padding:var(--pad);display:flex;flex-direction:column;gap:clamp(10px,2vw,22px);box-shadow:0 30px 60px -30px #0005;transition:height .3s ease,width .3s ease}
.bar{display:flex;align-items:center;gap:14px}
.lg{width:46px;height:46px;border-radius:14px;border:2px solid var(--g);background:#fff;object-fit:contain;flex:none}
.ttl{flex:1;font:700 clamp(19px,2.1vw,27px)/1.1 var(--px);letter-spacing:.04em;min-width:0;display:flex;flex-direction:column;justify-content:space-between;min-height:46px;padding:1px 0}
.trow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#t1{font-weight:700}#t2{color:#D9661A;margin-left:12px}
.ttl.nt{justify-content:center}.ttl.nt .trow{align-items:center}/* tanpa progress bar: judul rata tengah dgn logo */
.trk{position:relative;height:20px;margin:2px 5px 0 13px;visibility:hidden}
.trk:before{content:'';position:absolute;left:0;right:0;top:calc(50% - 1.5px);height:3px;border-radius:2px;background:var(--o)}
.trk u{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--o);transform:translate(-50%,-50%)}
.av{position:absolute;z-index:1;top:50%;width:26px;height:26px;border-radius:50%;border:2px solid var(--g);background:#fff;transform:translate(-50%,-50%);transition:left .8s cubic-bezier(.5,1.4,.5,1);object-fit:contain}
.clk{font:700 clamp(15px,1.9vw,22px)/1.2 var(--bf);letter-spacing:.02em;color:#D9661A;font-style:normal;flex:none}
.rb{width:46px;height:46px;border-radius:30%;border:0;background:var(--g);display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .15s}
.rb:active,.nv:active,.go:active{transform:scale(.92)}.rb svg{width:24px;fill:#fff}
#sp{position:absolute;right:clamp(14px,2.6vw,34px);top:86px;background:#fff;border:3px solid var(--bd);border-radius:16px;padding:14px;display:none;flex-direction:column;gap:12px;z-index:5;font-size:13px}#sp.on{display:flex}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;overflow-y:auto;padding:2px 3px 12px;scrollbar-width:none;transition:opacity .22s,transform .22s}.stage::-webkit-scrollbar{display:none}
.stage.out{opacity:0;transform:translateY(10px)}.stage>*{animation:in .5s both}@keyframes in{from{opacity:0;transform:translateY(14px)}}
.sp{flex:1 0 auto;display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(14px,3vw,36px)}
.col{display:flex;flex-direction:column;gap:16px}.col>:first-child{margin-top:auto}.col>:last-child{margin-bottom:auto}.stage>.col{flex:1 0 auto}.col.g{color:var(--g)}.col.g>:first-child{margin-top:0}
.med{border-radius:18px;overflow:hidden;background:#e7dff5;position:relative;min-height:160px}
.med img,.med video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;border:3px dashed #a9a3c9;border-radius:18px;color:#6d6896;font:600 13px var(--gf);padding:12px}.ph small{display:block;opacity:.7;margin-top:6px;font-weight:400}
.bub{background:var(--cream);border:3px solid var(--bd);border-radius:16px;padding:14px 18px;box-shadow:0 6px 0 var(--bd);font-size:clamp(12.5px,1.45vw,16.5px);line-height:1.55}
.row{display:flex;gap:12px;align-items:center}.row .bub{flex:1}
.ib{flex:none;width:clamp(58px,8vw,86px);aspect-ratio:1;border:3px solid #E53935;border-radius:16px;background:var(--cream);display:grid;place-items:center;font-size:clamp(28px,4vw,44px);box-shadow:0 6px 0 #f3a39f}
.in{border:3px solid var(--o);border-radius:99px;padding:13px 20px;font:500 15px var(--gf);background:#fff;outline:0}.in.er{border-color:#E53935;animation:sk .35s}@keyframes sk{30%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.go{border:0;border-radius:99px;background:var(--o);color:#fff;font:700 20px var(--px);letter-spacing:.14em;padding:14px 24px;box-shadow:0 5px 0 var(--od);cursor:pointer;transition:transform .15s}
.nav{display:flex;justify-content:space-between;flex:none;transition:opacity .22s}.nav.out{opacity:0}.nav.off{display:none}
.nv{width:clamp(48px,6vw,60px);aspect-ratio:1;border-radius:50%;border:0;background:var(--o);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 var(--od);transition:.15s}.nv svg{width:55%}.nv.r svg{transform:scaleX(-1)}
.qg{flex:1 0 auto;display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(14px,3vw,36px)}
.lf{display:flex;flex-direction:column;gap:12px;min-height:0}.lf .med{flex:1 1 0;min-height:clamp(150px,30vh,300px)}
.sc{flex:none;font:500 clamp(14px,1.55vw,19px)/1.5 var(--gf);-webkit-text-stroke:.45px currentColor;paint-order:stroke fill}.rt{display:flex;flex-direction:column;min-height:0}.rt h3{flex:none;font:500 clamp(15px,1.8vw,21px) var(--gf);margin-bottom:12px;-webkit-text-stroke:.45px currentColor}
.opts{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:12px}
.op{display:flex;align-items:flex-start;background:#fff;border:0;border-radius:12px;padding:16px 18px;font:500 clamp(14px,1.55vw,20px)/1.38 var(--gf);text-align:left;cursor:pointer;transition:.15s;color:var(--ink)}
.op:nth-child(4n+1),.op:nth-child(4n+4){background:#757575;color:#fff}
.op:hover{transform:translateY(-2px)}.card .op.sel{background:var(--o);color:#fff;box-shadow:0 4px 0 var(--od);transform:translateY(2px)}
.rl{border-radius:20px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:24px;text-align:center}
.rl small{font:700 clamp(15px,1.9vw,21px) var(--gf);letter-spacing:.12em}.rl h1{font:900 clamp(36px,5.5vw,68px) var(--px);letter-spacing:.12em;text-indent:.12em;word-break:break-word}
.bts{display:flex;flex-direction:column;gap:12px;width:min(100%,280px);margin-top:10px}
/* flash: lingkaran putih membesar dari tengah — hanya transform + opacity (compositor/GPU), jadi tetap mulus walau main-thread lagi sibuk */
#flash{position:fixed;inset:0;z-index:100;overflow:hidden;opacity:0;pointer-events:none}
#flash i{position:absolute;inset:0;margin:auto;width:144vmax;height:144vmax;width:calc(hypot(100vw,100vh)*1.04);height:calc(hypot(100vw,100vh)*1.04);border-radius:50%;background:radial-gradient(circle,#fff 0,#fff 60%,#fff9e6 100%);transform:scale(1)}
#flash.in,#flash.out{pointer-events:auto;will-change:opacity}
#flash.in{opacity:1}
#flash.in i{will-change:transform,opacity;animation:flin .5s cubic-bezier(.6,0,.9,.5) forwards}
#flash.out{animation:flout .95s ease-out forwards}
@keyframes flin{from{opacity:0;transform:scale(0)}35%{opacity:1}to{opacity:1;transform:scale(1)}}
@keyframes flout{from{opacity:1}to{opacity:0}}
/* saat transisi pintu→hasil (layar tertutup putih): matikan transisi berat (gradasi langit, tinggi kartu) supaya tidak repaint/layout tiap frame */
body.rvl,body.rvl .card{transition:none}
body.rvl .pf{will-change:transform}
body.rvr .pf{animation:rvl 1.3s ease-out}
body.rvr .pf:after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;background:#fff;animation:rvlw 1.3s ease-out both}
@keyframes rvl{from{transform:scale(1.07)}to{transform:none}}
@keyframes rvlw{from{opacity:.66}to{opacity:0}}
.pf{background:transparent}.pf:has(.ph){background:#e7dff5}.pf img{object-fit:cover}
.med.dr{flex:1}
.hi{font:700 clamp(28px,3.4vw,42px)/1.15 var(--px);letter-spacing:.02em;color:var(--ink)}
.unm{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:6;border:0;border-radius:99px;background:#1D1B22d9;color:#fff;font:700 13px var(--bf);letter-spacing:.06em;padding:11px 18px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 14px #0006}
.pf{container-type:inline-size;aspect-ratio:9/16}
/* kotak nama: semua ukuran dalam cqw (% lebar poster) → proporsi selalu sama di mobile & desktop; nama panjang wrap 2 baris + font menyusut otomatis (fitName) */
.nmo{position:absolute;top:5%;left:50%;transform:translateX(-50%);background:#fff;border-radius:4cqw;padding:1.5cqw 4.8cqw;text-align:center;z-index:2;width:max-content;max-width:66cqw}
.nmo small{font:600 2.5cqw/1.2 var(--gf);letter-spacing:.14em;display:block}.nmo b{display:block;font:700 4.8cqw/1.1 var(--px);overflow-wrap:anywhere;text-wrap:balance}
.mod{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#ffffff40;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .4s}.mod.on{opacity:1;pointer-events:auto}
.mw{width:min(88vw,330px);display:flex;flex-direction:column;align-items:center;gap:22px}
.bub.or{border-color:var(--o);box-shadow:none;text-align:center;position:relative;font-family:var(--gf);font-size:14px;width:100%;transform-origin:88% 100%}
.bub.or:after{content:'';position:absolute;right:30px;bottom:-12px;border:9px solid transparent;border-top:12px solid var(--o);border-bottom:0}
/* ===== POPUP CHECKPOINT: chest (back/dome + front/label), icon, stars ===== */
.chest{position:relative;width:100%;margin-top:96px}
.cb{position:absolute;inset:0;border-radius:44px 44px 18px 18px;background:linear-gradient(#ffd27a,#f9a24a);transform-origin:50% 100%}
.cf{position:relative;z-index:3;margin-top:62px;padding:16px;border-radius:18px;background:linear-gradient(#ffb858,#f58a30);box-shadow:0 6px 0 var(--od),inset 0 3px 0 #ffd89a;transform-origin:50% 100%}
.ic{position:absolute;left:50%;top:-96px;transform:translateX(-50%);width:200px;height:156px;z-index:2;font-size:92px;line-height:1}
.ico{width:100%;height:100%;display:grid;place-items:center}.ico img,.ico video{max-width:100%;max-height:100%;object-fit:contain}
.lb{background:var(--cream);border-radius:14px;padding:12px;text-align:center;color:#F5A14A;font:700 clamp(24px,4vw,31px)/1.1 var(--px)}
.sx{position:absolute;z-index:4;width:var(--s);height:var(--s);display:block}
.sx svg,.sx img{width:100%;height:100%;display:block;overflow:visible}
.sx svg path{fill:var(--o);stroke:#fff;stroke-width:2.2;stroke-linejoin:round;paint-order:stroke fill}
.sx.s1{--s:52px;left:calc(1% - 26px);top:26px;rotate:-14deg}
.sx.s2{--s:52px;left:calc(72% - 26px);top:-106px;rotate:12deg}
.sx.s3{--s:48px;left:calc(91% - 24px);top:-46px;rotate:18deg}
.sx.s4{--s:22px;left:calc(87% - 11px);top:21px;rotate:10deg}
/* animasi (mulai saat modal .on): label pop -> dome naik -> ikon keluar -> bintang meletup + bubble -> idle ngambang */
.mod.on .cf{animation:cf .34s cubic-bezier(.3,1.7,.5,1) .26s both}
.mod.on .cb{animation:lid .36s cubic-bezier(.3,1.5,.5,1) .52s both}
.mod.on .ico{animation:ir .72s cubic-bezier(.25,.9,.35,1) .76s both,bob 1.9s ease-in-out 1.5s infinite}
.mod.on .bub.or{animation:bp .42s cubic-bezier(.3,1.6,.5,1) .96s both}
.mod.on .sx{animation:sp .5s cubic-bezier(.3,1.8,.5,1) calc(var(--d) + 1s) both,tw 1.9s ease-in-out calc(var(--d) + 1.5s) infinite}
.sx.s1{--d:0s}.sx.s2{--d:.08s}.sx.s3{--d:.16s}.sx.s4{--d:.24s}
.mod.on #ct{animation:in .45s ease 1.3s both}
@keyframes cf{from{transform:scale(.4);opacity:0}}
@keyframes lid{from{transform:scaleY(.05);opacity:0}}
@keyframes ir{0%{transform:translateY(96px) scale(.55);opacity:0}18%{opacity:1}68%{transform:translateY(-14px) scale(1.05)}100%{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes bp{from{transform:scale(.2);opacity:0}}
@keyframes sp{from{transform:scale(0) rotate(-70deg);opacity:0}}
@keyframes tw{50%{transform:scale(1.14) rotate(9deg)}}
/* ===== HERO (desktop): foto FULL-BLEED tanpa margin & tanpa crop: lebar kolom = tinggi kartu x rasio foto (--har diisi JS dari ukuran asli foto) ===== */
@media(min-width:821px){
.card.split{--hw:min(calc((85vh - 6px)*var(--har,.69)),52%)}
.card.res{width:min(94vw,1180px);height:min(90vh,680px)}
.card.split .hero{background:#F8EEE9}
.card.split .hero img,.card.split .hero video{object-fit:contain}
}
/* ===== PROTEKSI MEDIA: tidak bisa di-drag / long-press simpan ===== */
img,video{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* ===== ROTATE PROMPT (HP): video pintu landscape -> minta putar HP dulu, lalu minta putar balik setelah selesai ===== */
#rot{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right));text-align:center;background:rgba(248,238,233,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#rot.on{display:flex;animation:in .35s both}
#rot .rph{width:min(30vw,120px);height:auto;flex:none;overflow:visible}
#rot.land .rph{animation:rotL 2.8s ease-in-out infinite}#rot.port .rph{animation:rotP 2.8s ease-in-out infinite}
@keyframes rotL{0%,18%{transform:rotate(0)}48%,82%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@keyframes rotP{0%,18%{transform:rotate(-90deg)}48%,82%{transform:rotate(0)}100%{transform:rotate(-90deg)}}
#rot .rtx{display:flex;flex-direction:column;align-items:center;gap:10px}
#rot h2{font:700 clamp(30px,8.4vw,44px)/1.02 var(--px);color:#D9661A;letter-spacing:.02em}
#rot p{font:500 clamp(14px,3.8vw,16px)/1.5 var(--gf);max-width:30ch}
#rot small{font:400 11.5px/1.5 var(--bf);opacity:.7;max-width:36ch}
#rot .rsk{border:0;background:none;font:600 13px var(--bf);color:var(--g);text-decoration:underline;text-underline-offset:3px;padding:8px 10px;cursor:pointer}
@media(max-height:480px){#rot{flex-direction:row;gap:28px}#rot .rph{width:76px}#rot h2{font-size:30px}#rot p{font-size:14px;max-width:34ch}}
@media(prefers-reduced-motion:reduce){#rot .rph{animation:none!important}#rot.land .rph{transform:rotate(-90deg)}}
/* HP landscape: kartu pintu memenuhi layar, video utuh (tidak di-crop) */
@media(orientation:landscape) and (max-height:600px){
.card.dor{width:100vw;height:100vh;height:100dvh;border-radius:0;border-bottom:0;box-shadow:none}
.card.dor .med.dr video,.card.dor .med.dr img{object-fit:contain}
.card.dor .nav{left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px))}
}
/* ===== GEMBOK ANIMASI (popup Pintu Terbuka): body + handle dari SVG, loop: kebuka -> kekunci -> kebuka ... ===== */
.ic.lk{width:192px;height:auto;aspect-ratio:240/302;top:-116px;font-size:0}
.lkx{display:block;width:100%;height:100%;overflow:visible}
.ic.lk.dk{width:168px;aspect-ratio:666/834;top:-176px}.mod:not(.on) .odl,.mod:not(.on) .odr{animation:none}@media(prefers-reduced-motion:reduce){.odl,.odr{animation:none}.odl{translate:-312px 0}.odr{translate:328px 0}}
.lkx .sh,.lkx .bd{animation-duration:3.4s;animation-iteration-count:infinite;animation-fill-mode:both}
.lkx .sh{animation-name:lkSh;animation-timing-function:ease-in-out}
.lkx .bd{animation-name:lkBd;animation-timing-function:ease-out}
.mod:not(.on) .lkx .sh,.mod:not(.on) .lkx .bd{animation:none}
.mod.on .lkx .sh,.mod.on .lkx .bd{animation-delay:1.15s}
@keyframes lkSh{
0%,6%{transform:translate(0,0) rotate(0)}
20%{transform:translate(-7px,-26px) rotate(0)}
32%{transform:translate(-7px,-26px) rotate(-13deg)}
54%{transform:translate(-7px,-26px) rotate(-13deg)}
64%{transform:translate(-7px,-26px) rotate(0)}
71%{transform:translate(1px,4px) rotate(0)}
75%,100%{transform:translate(0,0) rotate(0)}}
@keyframes lkBd{0%,70%{transform:translate(0,0)}73%{transform:translate(0,3px)}77%{transform:translate(0,-1px)}81%,100%{transform:translate(0,0)}}
@media(prefers-reduced-motion:reduce){.lkx .sh,.lkx .bd{animation:none!important}.lkx .sh{transform:translate(-7px,-26px) rotate(-13deg)}}
.sils{display:flex;gap:2px;align-items:flex-end}.sils i{width:26px;height:56px;border:3px solid #111;border-radius:50% 50% 30% 30%}
/* ===== SPLIT: Ilustrasi 1 & 2 = gambar setengah layar (kiri, full-bleed) ===== */
.hero{display:none;position:relative;overflow:hidden;background:#e7dff5;transition:opacity .22s}.hero.out{opacity:0}
.hero img,.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.hero .ph{border-radius:0}
.bar{transition:opacity .22s}.card.chg .bar{opacity:0}
.card.split{display:grid;grid-template-columns:var(--hw) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:var(--pad);row-gap:clamp(10px,2vw,22px);padding-left:0}
.card.split .hero{display:block;grid-column:1;grid-row:1/-1;margin:calc(var(--pad)*-1) 0;border-radius:28px 0 0 22px}
.card.split .bar{grid-column:2;grid-row:1}
.card.split .stage{grid-column:2;grid-row:2;padding-bottom:84px}

.card.dor .nav{position:absolute;left:clamp(14px,2.6vw,34px);right:clamp(14px,2.6vw,34px);bottom:max(clamp(14px,2.6vw,34px),env(safe-area-inset-bottom,0px));z-index:4;pointer-events:none}
.card.dor .nav .nv{pointer-events:auto}
/* ===== SKY WINDOW (mobile): siklus siang-malam tampil di header karena background body tertutup kartu ===== */
.skyw{display:none}
@media(max-width:820px){.card{--pad:14px;gap:16px;width:100vw;height:100dvh;border-radius:0;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}

/* =====================================================================
   DECODER GIF → PNG (frame TERAKHIR), vanilla JS murni, tanpa library luar.
   Dipakai supaya hasil download poster selalu berupa gambar STATIS (bukan
   GIF yang jalan terus), dan supaya ambil pixel-nya tidak kena blokir
   "tainted canvas" seperti kalau diambil langsung dari elemen <img>.
   decodeGifLastFrame(buffer) -> {width, height, data:Uint8ClampedArray RGBA}
   ===================================================================== */
function lzwDecode(minCodeSize,bytes,pixelCount){
  let pos=0;
  const readCode=size=>{let code=0;for(let i=0;i<size;i++){if(bytes[pos>>3]&(1<<(pos&7)))code|=1<<i;pos++}return code};
  const clearCode=1<<minCodeSize,endCode=clearCode+1;
  let codeSize=minCodeSize+1,dict=[];
  const clear=()=>{dict=[];for(let i=0;i<clearCode;i++)dict[i]=[i];dict[clearCode]=[];dict[endCode]=null;codeSize=minCodeSize+1};
  clear();
  const out=[];let code,last;
  while(out.length<pixelCount){
    last=code;code=readCode(codeSize);
    if(code===clearCode){clear();continue}
    if(code===endCode)break;
    if(code<dict.length){if(last!==clearCode&&last!==undefined)dict.push(dict[last].concat(dict[code][0]))}
    else{if(last===undefined)break;dict.push(dict[last].concat(dict[last][0]))}
    out.push.apply(out,dict[code]);
    if(dict.length===(1<<codeSize)&&codeSize<12)codeSize++;
  }
  return out;
}
function deinterlaceGif(idx,w,h){
  const out=new Array(w*h),passes=[[0,8],[4,8],[2,4],[1,2]];let srcRow=0;
  for(const[start,step] of passes)for(let y=start;y<h;y+=step){for(let x=0;x<w;x++)out[y*w+x]=idx[srcRow*w+x];srcRow++}
  return out;
}
function decodeGifLastFrame(buf){
  const d=new Uint8Array(buf);let p=6;
  const u8=()=>d[p++],u16=()=>{const v=d[p]|(d[p+1]<<8);p+=2;return v};
  if(String.fromCharCode(d[0],d[1],d[2])!=='GIF')throw new Error('bukan file GIF');
  const W=u16(),H=u16(),pk=u8();u8();u8();
  let gct=null;
  if(pk&0x80){gct=[];const n=1<<((pk&7)+1);for(let i=0;i<n;i++){gct.push([d[p],d[p+1],d[p+2]]);p+=3}}
  const canvasBuf=new Uint8ClampedArray(W*H*4);
  const clearRect=r=>{for(let y=0;y<r.height;y++)for(let x=0;x<r.width;x++){const o=((r.top+y)*W+(r.left+x))*4;canvasBuf[o]=canvasBuf[o+1]=canvasBuf[o+2]=canvasBuf[o+3]=0}};
  const getRect=r=>{const out=new Uint8ClampedArray(r.width*r.height*4);for(let y=0;y<r.height;y++)for(let x=0;x<r.width;x++){const o=((r.top+y)*W+(r.left+x))*4,o2=(y*r.width+x)*4;for(let i=0;i<4;i++)out[o2+i]=canvasBuf[o+i]}return out};
  const putRect=(r,src)=>{for(let y=0;y<r.height;y++)for(let x=0;x<r.width;x++){const o=((r.top+y)*W+(r.left+x))*4,o2=(y*r.width+x)*4;for(let i=0;i<4;i++)canvasBuf[o+i]=src[o2+i]}};
  let gceDisposal=0,gceTransparent=-1,haveGCE=false,prevRect=null,prevDisposal=0,savedRegion=null;
  const skipSub=()=>{let n;while((n=u8())!==0)p+=n};
  while(p<d.length){
    const sep=u8();
    if(sep===0x3B)break;
    if(sep===0x21){
      const label=u8();
      if(label===0xF9){u8();const fl=u8();gceDisposal=(fl>>2)&7;const hasT=fl&1;u16();const ti=u8();u8();gceTransparent=hasT?ti:-1;haveGCE=true}
      else skipSub();
      continue;
    }
    if(sep===0x2C){
      const left=u16(),top=u16(),iw=u16(),ih=u16(),ipk=u8();
      const interlace=!!(ipk&0x40);
      let lct=null;
      if(ipk&0x80){lct=[];const n=1<<((ipk&7)+1);for(let i=0;i<n;i++){lct.push([d[p],d[p+1],d[p+2]]);p+=3}}
      const ct=lct||gct||[[0,0,0]];
      const minCode=u8();
      const bytes=[];{let n;while((n=u8())!==0){for(let i=0;i<n;i++)bytes.push(d[p+i]);p+=n}}
      const idx=lzwDecode(minCode,bytes,iw*ih);
      const px=interlace?deinterlaceGif(idx,iw,ih):idx;
      if(prevRect){if(prevDisposal===2)clearRect(prevRect);else if(prevDisposal===3&&savedRegion)putRect(prevRect,savedRegion)}
      const thisDisposal=haveGCE?gceDisposal:0;
      savedRegion=thisDisposal===3?getRect({left,top,width:iw,height:ih}):null;
      const trans=haveGCE?gceTransparent:-1;
      for(let y=0;y<ih;y++)for(let x=0;x<iw;x++){
        const colIdx=px[y*iw+x];if(colIdx===trans)continue;
        const c=ct[colIdx]||[0,0,0],dx=left+x,dy=top+y;if(dx<0||dy<0||dx>=W||dy>=H)continue;
        const o=(dy*W+dx)*4;canvasBuf[o]=c[0];canvasBuf[o+1]=c[1];canvasBuf[o+2]=c[2];canvasBuf[o+3]=255;
      }
      prevRect={left,top,width:iw,height:ih};prevDisposal=thisDisposal;haveGCE=false;gceTransparent=-1;gceDisposal=0;
      continue;
    }
    break;
  }
  return {width:W,height:H,data:canvasBuf};
}

const cv=document.getElementById('ldgame'),ld=document.getElementById('ld');if(!cv||!ld)return;
const W=320,H=190,dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
const img=new Image();let imgOk=0;img.onload=()=>{imgOk=1};img.src=GAME_LOGO;
const G=1250,FL=-330,SP=100,GAP=72,PW=40,R=7,BX=84,GY=H-16;
let st=0,y,vy,pipes,score,best=0,spawn,rot,dieT=0,last=0,raf=0,cl=[[40,30,1],[170,18,.8],[270,44,.9]];
function reset(){y=H/2-8;vy=0;pipes=[];score=0;spawn=.8;rot=0}reset();
const act=()=>{if(st==2){if(performance.now()-dieT>450){reset();st=0}return}if(st==0)st=1;vy=FL};
const die=()=>{st=2;dieT=performance.now();if(score>best)best=score};
cv.addEventListener('pointerdown',e=>{e.preventDefault();act()});
document.addEventListener('keydown',e=>{if((e.code=='Space'||e.code=='ArrowUp')&&ld.isConnected&&!ld.classList.contains('out')&&(e.target===document.body||e.target===cv)){e.preventDefault();act()}});
function hit(px,gy){const cx=BX,cy=y;const r1=[px,0,PW,gy],r2=[px,gy+GAP,PW,GY-gy-GAP];return[r1,r2].some(([x,yy,w,h])=>{const nx=Math.max(x,Math.min(cx,x+w)),ny=Math.max(yy,Math.min(cy,yy+h));return(cx-nx)**2+(cy-ny)**2<R*R})}
function update(dt,n){
if(st!=2)cl.forEach(o=>{o[0]-=8*o[2]*dt;if(o[0]<-50)o[0]=W+30});
if(st==0){y=H/2-8+Math.sin(n/230)*5;rot=0;return}
if(st==1){vy+=G*dt;y+=vy*dt;rot=Math.max(-.45,Math.min(1.1,vy/460));if(y<R){y=R;vy=0}
spawn-=dt;if(spawn<=0){spawn=1.5;pipes.push({x:W+6,g:30+Math.random()*(GY-GAP-60),p:0})}
for(const p of pipes){p.x-=SP*dt;if(!p.p&&p.x+PW<BX-R){p.p=1;score++}if(hit(p.x,p.g)){die();break}}
while(pipes.length&&pipes[0].x<-PW-4)pipes.shift();
if(y+R>=GY){y=GY-R;die()}}
else if(st==2&&y+R<GY){vy+=G*dt;y=Math.min(GY-R,y+vy*dt);rot=1.2}}
function pipe(x,gy){const col='#0F6B35',lt='#2FA866';
c.fillStyle=col;c.fillRect(x+3,0,PW-6,gy-10);c.fillRect(x+3,gy+GAP+10,PW-6,GY-gy-GAP-10);
c.fillStyle=lt;c.fillRect(x+6,0,6,gy-10);c.fillRect(x+6,gy+GAP+10,6,GY-gy-GAP-10);
c.fillStyle=col;c.fillRect(x,gy-10,PW,10);c.fillRect(x,gy+GAP,PW,10);c.fillStyle=lt;c.fillRect(x+3,gy-10,6,10);c.fillRect(x+3,gy+GAP,6,10)}
function drawG(n){
const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#F8EEE9');g.addColorStop(1,'#FBE3C6');c.fillStyle=g;c.fillRect(0,0,W,H);
c.fillStyle='#fff';c.globalAlpha=.85;cl.forEach(([x,yy,k])=>{c.beginPath();c.ellipse(x,yy,20*k,8*k,0,0,7);c.ellipse(x+14*k,yy+3,16*k,7*k,0,0,7);c.ellipse(x-14*k,yy+3,14*k,6*k,0,0,7);c.fill()});c.globalAlpha=1;
pipes.forEach(p=>pipe(p.x,p.g));
c.fillStyle='#E3DACB';c.fillRect(0,GY,W,H-GY);c.fillStyle='#F28A30';c.fillRect(0,GY,W,3);
c.save();c.translate(BX,y);c.rotate(rot);
if(imgOk){const ar=img.naturalWidth/img.naturalHeight||1,bw=ar>=1?28:28*ar,bh=ar>=1?28/ar:28;c.drawImage(img,-bw/2,-bh/2,bw,bh)}else{c.fillStyle='#F28A30';c.beginPath();c.arc(0,0,R+2,0,7);c.fill()}
c.restore();
c.textAlign='center';c.lineJoin='round';c.font='700 30px Handjet,monospace';c.lineWidth=5;c.strokeStyle='#fff';c.fillStyle='#C4631A';
if(st==1){c.strokeText(score,W/2,34);c.fillText(score,W/2,34)}
c.font='700 15px Handjet,monospace';c.lineWidth=4;
const tx=(t,yy)=>{c.strokeText(t,W/2,yy);c.fillText(t,W/2,yy)};
if(st==0){c.fillStyle='#1D1B22';tx('KETUK / SPASI UNTUK TERBANG',H-34);}
if(st==2){c.font='700 24px Handjet,monospace';c.fillStyle='#C4631A';tx('TABRAK!  SKOR '+score,H/2-6);c.font='700 15px Handjet,monospace';c.fillStyle='#1D1B22';tx('TERBAIK '+best+'  ·  KETUK UNTUK MAIN LAGI',H/2+16)}}
function frame(n){if(!ld.isConnected||ld.classList.contains('out'))return;raf=requestAnimationFrame(frame);const dt=Math.min(.033,(n-last)/1000||0);last=n;update(dt,n);drawG(n)}
raf=requestAnimationFrame(frame);
})();
